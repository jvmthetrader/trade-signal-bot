name: trade-signal

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (UTC)
  workflow_dispatch: {}       # allow manual runs

permissions:
  contents: write             # needed to commit state.json back

concurrency:
  group: trade-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m signalbot.main

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet state.json; then
            git add state.json
            git commit -m "chore: update alert state [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push
          else
            echo "no state change"
          fi
